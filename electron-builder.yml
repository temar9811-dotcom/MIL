# # FILE: electron-builder.yml
# # VERSION: 2
appId: com.mrchi.intel-lite
productName: MRCHI Intel Lite
asar: false
directories:
  output: dist
files:
  - "**/*"
  - "!static.db"
  - "!dist/**"
  - "!diag.js"
  - "!test-sound.js"
  - "!extract-eve-data.js"
win:
  target:
    - nsis
  # Build icon for the installer and executable
  icon: assets/build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MRCHI Intel Lite
publish:
  provider: github
  owner: temar9811-dotcom
  repo: MIL
  private: false
  releaseType: release