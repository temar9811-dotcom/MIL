<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>MRCHI Intel Lite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>MRCHI Intel Lite <span id="app-version">v0.0.0</span></h1>
    <div class="header-right">
      <span id="engine-status" class="status">engine: starting…</span>
    </div>
  </header>

  <main>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="roster-container">
          <h2>Characters</h2>
          <ul id="roster-list" class="roster-list">
            <li class="roster-empty">No characters detected yet</li>
          </ul>
        </div>
      </aside>

      <div class="content-area">
        <nav class="file-tabs">
          <button class="tab-btn active" data-tab="alerts">Alerts</button>
          <button class="tab-btn" data-tab="alert-settings">Alert Settings</button>
          <button class="tab-btn" data-tab="watch-list">Watch List</button>
          <button class="tab-btn" data-tab="other-settings">Other Settings</button>
          <button class="tab-btn hidden" data-tab="debug" id="debug-tab-btn">Debug</button>
        </nav>

        <section class="tab-content active" data-tab="alerts">
          <div class="panel full-height">
            <div class="debug-header">
              <h2>Active Alerts</h2>
              <div class="tab-actions">
                <button id="clear-alerts" type="button">Clear</button>
                <button id="popout-alerts" type="button">Pop out</button>
                <button id="open-pyramid" type="button">Map</button>
              </div>
            </div>
            <div id="alerts" class="scrollable"></div>
          </div>
        </section>

        <form id="settings-form">
          <section class="tab-content" data-tab="alert-settings">
            <div class="panel scrollable">
              <h2>Alert Settings</h2>
              <div class="row">
                <label for="proximity-range">Proximity range (jumps)</label>
                <input id="proximity-range" type="number" min="0" step="1" value="2" />
              </div>
              <div class="row">
                <label>Event pings</label>
                <div class="row checks">
                  <label><input id="ping-ess" type="checkbox" /> ESS</label>
                  <label><input id="ping-bubble" type="checkbox" /> Bubbles</label>
                  <label><input id="ping-drag" type="checkbox" /> Drag</label>
                  <label><input id="ping-ansiblex" type="checkbox" /> Ansiblex</label>
                  <label><input id="ping-camping" type="checkbox" /> Camping</label>
                </div>
              </div>
              <div class="row">
                <label>Group pings</label>
                <div id="group-alerts"></div>
              </div>
            </div>
          </section>

          <section class="tab-content" data-tab="watch-list">
            <div class="panel scrollable">
              <h2>Watch List</h2>
              <div id="watch-list"></div>
              <div class="row">
                <button id="add-watch" type="button">+ Add watch entry</button>
              </div>
            </div>
          </section>

          <section class="tab-content" data-tab="other-settings">
            <div class="panel scrollable" id="settings-panel">
              <h2>Other Settings</h2>
              <div class="row">
                <label for="log-path">Chat logs folder</label>
                <div class="row checks">
                  <input id="log-path" type="text" placeholder="empty = auto-detect" />
                  <button id="browse-logs" type="button">Browse…</button>
                </div>
              </div>
              <div class="row">
                <label for="intel-channels">Intel channels (comma separated)</label>
                <div class="row checks">
                  <input id="intel-channels" type="text" placeholder="e.g. fareast.imperium" />
                  <button id="imperium-intel" type="button">+ Add Imperium Intel</button>
                </div>
              </div>
              <div class="row checks">
                <label><input id="presence-windows" type="checkbox" checked /> Use EVE windows</label>
              </div>
              <div class="row">
                <label for="primary-char">Primary character</label>
                <select id="primary-char"><option value="">Auto (first online)</option></select>
              </div>
              <div class="row">
                <label for="intel-timeout">Auto Map timeout (mins)</label>
                <input id="intel-timeout" type="number" min="0" step="1" value="10" />
              </div>
              <div class="row">
                <label for="volume-red">Red volume <span id="volume-red-label">50%</span></label>
                <input id="volume-red" type="range" min="0" max="100" value="50" />
              </div>
              <div class="row">
                <label for="volume-soft">Soft volume <span id="volume-soft-label">50%</span></label>
                <input id="volume-soft" type="range" min="0" max="100" value="50" />
              </div>
              <div class="row">
                <label>Custom sounds</label>
                <div class="row checks">
                  <input id="alert-sound-path" type="text" placeholder="Red alert sound (empty = default)" />
                  <button id="browse-alert-sound" type="button">Browse…</button>
                </div>
                <div class="row checks">
                  <input id="soft-sound-path" type="text" placeholder="Soft alert sound (empty = default)" />
                  <button id="browse-soft-sound" type="button">Browse…</button>
                </div>
              </div>
              <div class="row checks">
                <label><input id="sound" type="checkbox" checked /> Sound</label>
                <label><input id="notifications" type="checkbox" checked /> Notifications</label>
                <label><input id="big-text" type="checkbox" /> Bigger text</label>
                <label><input id="enable-debug" type="checkbox" /> Enable Debug</label>
              </div>
              <div class="row">
                <button id="save" type="submit">Save</button>
                <span id="save-state"></span>
              </div>
            </div>
          </section>
        </form>

        <section class="tab-content" data-tab="debug">
          <div class="panel full-height">
            <div class="debug-header">
              <h2>Debug Log</h2>
              <div class="tab-actions">
                <button id="clear-debug" type="button">Clear</button>
              </div>
            </div>
            <div id="debug-panel" class="scrollable"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="ui-tabs.js"></script>
  <script src="ui-debug.js"></script>
  <script src="ui-watchlist.js"></script>
  <script src="ui-settings.js"></script>
  <script src="ui-alerts.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
