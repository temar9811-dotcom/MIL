<!-- MIL index.html v7 -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>MRCHI Intel Lite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>MRCHI Intel Lite <span id="app-version" style="font-size: 0.55em; color: #888; vertical-align: middle;"></span></h1>
    <span id="engine-status" class="status">engine: starting…</span>
    <label class="debug-label">
      <input type="checkbox" id="debug-toggle" /> Debug
    </label>
  </header>

  <main id="app">
    <div class="columns">
      <section class="panel" id="settings-panel">
        <h2>Settings</h2>
        <form id="settings-form">
          <div class="row">
            <label for="log-path">Chat logs folder</label>
            <div style="display: flex; gap: 8px;">
              <input id="log-path" type="text" style="flex: 1;" placeholder="Documents\EVE\logs\Chatlogs (empty = auto)" />
              <button id="browse-logs" type="button">Browse…</button>
            </div>
          </div>

          <div class="row">
            <label for="proximity-range">Proximity range (jumps)</label>
            <input id="proximity-range" type="number" min="0" step="1" value="2" />
          </div>

          <div class="row">
            <label for="intel-channels">Intel channels (comma separated)</label>
            <div style="display: flex; gap: 8px;">
              <input id="intel-channels" type="text" style="flex: 1;" placeholder="fareast.imperium" />
              <button id="imperium-intel" type="button">Imperium Intel</button>
            </div>
          </div>

          <div class="row checks">
            <label><input id="sound-enabled" type="checkbox" checked /> Play sound on alert</label>
            <label><input id="notification-enabled" type="checkbox" checked /> Show OS notification</label>
          </div>

          <div class="row">
            <label for="alert-volume">Alert volume</label>
            <div style="display: flex; align-items: center; gap: 8px;">
              <input id="alert-volume" type="range" min="0" max="100" step="5" value="50" style="flex: 1;" />
              <span id="alert-volume-label" style="width: 42px;">50%</span>
            </div>
          </div>

          <div class="row">
            <label>Soft alerts (watch list)</label>
            <label style="display: block; color: #4ade80; margin: 4px 0 8px; cursor: default;">
              Leave pilot or ship blank to match any. Extra range 0 = unlimited, a number limits pings to proximity + that many jumps.
            </label>
            <div id="watch-list"></div>
            <button id="add-watch" type="button">+ Add watch entry</button>
          </div>

          <div class="row">
            <button id="save" type="submit">Save</button>
            <span id="save-state"></span>
          </div>
        </form>
      </section>

      <div class="right-col">
        <section class="panel" id="roster-panel">
          <h2>Characters</h2>
          <div id="roster-list"></div>
        </section>

        <section class="panel" id="alerts-panel">
          <div class="debug-header">
            <h2>Alerts</h2>
            <button id="popout-alerts" type="button">Pop out</button>
          </div>
          <div id="alerts"></div>
        </section>

        <section class="panel">
          <div class="debug-header">
            <h2>Debug Log</h2>
            <button id="clear-debug" type="button">Clear</button>
          </div>
          <pre id="debug-panel"></pre>
        </section>
      </div>
    </div>
  </main>

  <script src="ui-watchlist.js"></script>
  <script src="ui-settings.js"></script>
  <script src="ui-debug.js"></script>
  <script src="ui-alerts.js"></script>
  <script src="ui-roster.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
