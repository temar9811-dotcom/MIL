<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>Local preview</title>
    <style>
      /* The main process sizes this window to exactly the capture's pixel
         dimensions, so nothing here may add a single pixel: no body margin,
         no scrollbars, no padding, no caption bar. The canvas is the whole
         window, painted 1:1 with no smoothing. */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        width: 100%;
        height: 100%;
      }
      body {
        /* The whole window doubles as its own drag handle, because a frameless
           window has no title bar to grab. Nothing inside needs the mouse. */
        -webkit-app-region: drag;
      }
      #view {
        display: block;
        margin: 0;
        padding: 0;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="view" width="1" height="1"></canvas>
    <script src="preview.js"></script>
  </body>
</html>
