<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>MRCHI Alerts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="alerts-window">
  <header>
    <h1>Alerts</h1>
    <label class="debug-label">
      <input type="checkbox" id="always-on-top" checked /> Always on top
    </label>
    <button id="close-alerts" class="win-close" type="button" title="Close" aria-label="Close">&#10005;</button>
  </header>

  <main id="app">
    <section class="panel">
      <div id="alerts"></div>
    </section>
  </main>

  <script src="ui-alert-card.js"></script>
  <script src="ui-alerts.js"></script>
  <script src="alerts-window.js"></script>
</body>
</html>
